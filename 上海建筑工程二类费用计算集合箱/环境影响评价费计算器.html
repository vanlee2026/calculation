<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>环境影响评价费计算器</title><style>
:root{--ink:#172033;--muted:#667085;--line:#dfe6f0;--page:#f4f7fb;--soft:#eff5ff;--blue:#2563eb;--dark:#1d4ed8;--warn:#a16207;--warnbg:#fffbeb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--page);color:var(--ink);line-height:1.55}.box{max-width:900px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 30px #17203312}h1{margin:0;font-size:25px}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.sub,.hint,.source{color:var(--muted);font-size:12px}.basis,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.basis{margin:18px 0;padding:16px;background:var(--soft);border:1px solid #c9dafc;border-radius:14px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,button{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;min-height:40px;background:#fff}button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:750;cursor:pointer;margin-top:16px}.card{padding:14px;border:1px solid var(--line);border-radius:12px}.result{margin-top:18px;padding:18px;background:var(--soft);border:1px solid #c9dafc;border-left:4px solid var(--blue);border-radius:14px}.total{font-size:31px;color:var(--dark);font-weight:850}.notice{margin-top:16px;padding:12px 14px;background:var(--warnbg);border:1px solid #f3d38a;border-radius:10px;color:var(--warn);font-size:12px}.table{margin-top:18px;overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{border:1px solid var(--line);padding:8px;text-align:center}.table th{background:var(--soft)}@media(max-width:700px){body{padding:14px}.box{padding:17px}.basis,.grid{grid-template-columns:1fr}}
</style><style id="palette-refresh">:root{--paper:#f4f1e9;--paper-panel:#fffdf8;--teal:#0f766e;--teal-dark:#0b5f59;--teal-soft:#e6f3ef;--amber:#9a5b13;--amber-soft:#fff3df;--ink-refresh:#20302f;--muted-refresh:#687773;--line-refresh:#d8e0dc;--focus-refresh:#b7cfc7}body{background:var(--paper)!important;color:var(--ink-refresh)!important}.container,.box,.card{background:var(--paper-panel)!important;border-color:var(--line-refresh)!important}.basis,.basis-bar{background:var(--teal-soft)!important;border-color:#a9d4c9!important}.basis select,.basis-bar select{border:2px solid var(--teal)!important;background:#fffdf8!important;box-shadow:0 0 0 3px rgba(15,118,110,.10)!important}.field input,.field select,.card input,.card select{border:2px solid var(--focus-refresh)!important;background:#fffdf8!important}.field:has(input[type=number]),.card:has(input[type=number]){box-shadow:inset 4px 0 0 var(--teal);background:#fcfaf3!important}.result,.result-box{background:var(--teal)!important;border-color:var(--teal-dark)!important;color:#fff!important}.result .total,.result .amount,.result .total-fee{color:#fff!important}.result .sub,.result .result-label,.result .breakdown,.result .breakdown strong{color:#e7f6f1!important}.notice{background:var(--amber-soft)!important;border-color:#e5b76b!important;color:var(--amber)!important}.source{color:var(--muted-refresh)!important}.source a{color:var(--teal-dark)!important;font-weight:800}.table th{background:var(--teal-soft)!important;color:var(--teal-dark)!important}button{background:var(--teal)!important;border-color:var(--teal)!important}button:hover{background:var(--teal-dark)!important}h1,h2,h3{color:var(--ink-refresh)!important}</style></head><body><main class="box"><div class="kicker">SHANGHAI · ENVIRONMENTAL IMPACT CONSULTING</div><h1>环境影响评价费计算器</h1><p class="sub">用于环境影响报告书、报告表及技术评估的前期费用参考测算。</p><section class="basis"><div><label>计算依据</label><select id="basis"><option value="national">[国家] 计价格〔2002〕125号《环境影响咨询收费有关问题的通知》</option></select></div><div id="note" class="sub"></div><div class="source basis-source" id="source" style="grid-column:1/-1;margin-top:0;padding-top:10px"></div></section><section class="grid"><div class="card"><label>项目总投资（万元）</label><input id="amount" type="number" value="1000" min="0"></div><div class="card"><label>环评服务类型</label><select id="type"><option value="report">环境影响报告书</option><option value="form">环境影响报告表</option><option value="review">报告书/表技术评估</option></select></div><div class="card"><label>合同调整系数（%）</label><input id="adjust" type="number" value="100" min="0"></div></section><button id="calc">计算环评咨询费</button><section class="result"><div class="sub">测算结果</div><div class="total" id="total">0.00 元</div><div id="detail" class="sub"></div></section><div id="notice" class="notice"></div><div class="table"><table><thead><tr><th>总投资（万元）</th><th>报告书参考费率（%）</th><th>报告表参考费率（%）</th></tr></thead><tbody id="table"></tbody></table></div></main><script>
const $=id=>document.getElementById(id),X=[0,300,2000,10000,50000,100000,500000,Infinity],R={report:[.15,.12,.08,.04,.02,.01,.005],form:[.06,.05,.03,.015,.008,.004,.002],review:[.05,.04,.025,.012,.006,.003,.0015]};function calc(){let m=$('basis').value,a=Math.max(0,Number($('amount').value)||0),adj=(Number($('adjust').value)||0)/100,t=$('type').value,r=R[t],fee=0,parts=[];for(let i=0;i<r.length;i++){let u=X[i+1],p=Math.max(0,Math.min(a,u)-X[i]);if(p>0){fee+=p*r[i]/100;parts.push(`${X[i]}—${u===Infinity?'以上':u}：${p.toFixed(2)}×${r[i]}%`)}if(a<=u)break}fee*=10000*adj;$('total').textContent=fee.toLocaleString('zh-CN',{minimumFractionDigits:2})+' 元';$('detail').textContent=parts.join('；')+`；调整 ${adj*100}%`;$('note').textContent=m==='national'?'125号文为国家历史政府指导价参考；2015年后环境影响咨询费实行市场调节价。':m==='pudong'?'未查到浦东新区另行制定环评咨询费率，按市场合同及国家历史参考口径。':'上海未形成一套普遍适用的地方统一环评服务费率，通常按市场合同确定。';$('notice').textContent='本页费率仅作前期估算，未替代生态环境部门关于环评分类、编制范围和技术评估的要求；报告书/报告表分类应先按现行环保法规确认。';$('source').innerHTML='依据：计价格〔2002〕125号；发改价格〔2015〕299号；国家发展改革委关于环境监测与评估收费事项的说明。'}$('table').innerHTML=X.slice(0,-1).map((x,i)=>`<tr><td>${x}—${X[i+1]===Infinity?'以上':X[i+1]}</td><td>${R.report[i]}%</td><td>${R.form[i]}%</td></tr>`).join('');['basis','type','amount','adjust'].forEach(id=>$(id).addEventListener('input',calc));$('calc').onclick=calc;calc();
</script></body></html>
