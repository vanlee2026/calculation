<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上海建筑工程二类费用计算集合箱</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #6d7789;
      --line: #e5e9f0;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --blue: #2563eb;
      --blue-soft: #eff5ff;
      --navy: #172554;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .topbar {
      background: linear-gradient(118deg, #172554 0%, #1e40af 58%, #2563eb 100%);
      color: #fff;
      padding: 30px 28px 28px;
    }
    .topbar-inner, .shell { max-width: 1440px; margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; color: #bfdbfe; font-size: 12px; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 38px); letter-spacing: .02em; }
    .subtitle { margin: 10px 0 0; color: #dbeafe; font-size: 14px; }
    .shell { padding: 22px 24px 30px; }
    .workspace {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .sidebar, .viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 28px rgba(22, 35, 64, .06); }
    .sidebar { padding: 15px; position: sticky; top: 18px; }
    .side-title { padding: 8px 10px 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
    .tool-tab {
      width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left;
      padding: 13px 12px; border-radius: 12px; cursor: pointer; display: flex; gap: 11px; align-items: flex-start;
      transition: .18s ease; font: inherit;
    }
    .tool-tab:hover { background: #f5f8ff; }
    .tool-tab.active { background: var(--blue-soft); color: #1744a0; box-shadow: inset 3px 0 0 var(--blue); }
    .number { flex: 0 0 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #edf1f7; color: #64748b; font-size: 12px; font-weight: 800; }
    .active .number { color: #fff; background: var(--blue); }
    .tool-name { display: block; font-size: 14px; font-weight: 700; line-height: 1.4; }
    .tool-desc { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .active .tool-desc { color: #5574b8; }
    .viewer { min-width: 0; overflow: hidden; }
    .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .current-title { margin: 0; font-size: 17px; }
    .current-note { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .open-link { color: var(--blue); font-size: 13px; text-decoration: none; white-space: nowrap; }
    .open-link:hover { text-decoration: underline; }
    iframe { width: 100%; height: 850px; display: block; border: 0; background: #fff; }
    @media (max-width: 860px) {
      .topbar { padding: 24px 18px; }
      .shell { padding: 14px 12px 22px; }
      .workspace { grid-template-columns: 1fr; gap: 12px; }
      .sidebar { position: static; padding: 10px; overflow-x: auto; }
      .side-title { display: none; }
      .tool-list { display: flex; gap: 7px; min-width: max-content; }
      .tool-tab { width: auto; min-width: 154px; padding: 10px; }
      .tool-desc { display: none; }
      .viewer-head { padding: 14px; }
      iframe { height: 900px; }
    }
  </style>
  <style id="palette-refresh">
    :root { --ink:#20302f; --muted:#687773; --line:#d8e0dc; --panel:#fffdf8; --bg:#f4f1e9; --blue:#0f766e; --blue-soft:#e6f3ef; --navy:#183c3a; }
    body { background:var(--bg); color:var(--ink); }
    .topbar { background:linear-gradient(120deg,#183c3a 0%,#0f766e 68%,#2b8c7f 100%); }
    .sidebar,.viewer { background:var(--panel); border-color:var(--line); }
    .tool-tab:hover { background:#edf6f2; }
    .tool-tab.active { background:#e0f1eb; color:#0b5f59; box-shadow:inset 3px 0 0 #0f766e; }
    .number { background:#e8eeeb; color:#667773; }
    .active .number { background:#0f766e; }
    .active .tool-desc { color:#4c8279; }
    .open-link { color:#0f766e; }
    .summary-button { width:100%; margin:8px 0 10px; padding:11px 12px; border:1px solid #0f766e; border-radius:10px; background:#0f766e; color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .summary-button:hover { background:#0b5f59; }
    .summary-panel { position:fixed; inset:0; z-index:20; display:none; padding:28px; background:rgba(24,60,58,.42); }
    .summary-panel.open { display:block; }
    .summary-card { max-width:1280px; max-height:calc(100vh - 56px); margin:auto; overflow:auto; padding:24px; border:1px solid #d8e0dc; border-radius:18px; background:#fffdf8; box-shadow:0 24px 70px rgba(24,60,58,.25); }
    .summary-head { display:flex; justify-content:space-between; align-items:start; gap:16px; margin-bottom:14px; }
    .summary-head h2 { margin:0; color:#20302f; }
    .summary-close { width:auto; margin:0; padding:7px 12px; background:#e6f3ef; color:#0b5f59; border:1px solid #a9d4c9; }
    .summary-lead { margin:0 0 16px; color:#687773; font-size:13px; }
    .summary-table { width:100%; min-width:980px; border-collapse:collapse; font-size:12px; }
    .summary-table th,.summary-table td { padding:10px; border:1px solid #d8e0dc; vertical-align:top; text-align:left; }
    .summary-table th { background:#e6f3ef; color:#0b5f59; }
    .summary-table .fee { color:#0b5f59; font-weight:850; white-space:nowrap; }
    .summary-table .ratio { color:#9a5b13; font-weight:800; white-space:nowrap; }
    .summary-table small { color:#687773; }
    @media(max-width:700px){.summary-panel{padding:12px}.summary-card{padding:16px;max-height:calc(100vh - 24px)}.summary-head{align-items:center}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="eyebrow">SHANGHAI · CONSTRUCTION COST TOOLS</p>
      <h1>上海建筑工程二类费用计算集合箱</h1>
      <p class="subtitle">常用检测、勘察设计、监理、造价咨询及审图费用，一页切换，分别测算。</p>
    </div>
  </header>

  <main class="shell">
    <div class="workspace">
      <nav class="sidebar" aria-label="计算器选项卡">
        <div class="side-title">计算工具（9 项）</div>
        <button class="summary-button" id="summaryButton" type="button">一键查看测算汇总</button>
        <div class="tool-list" id="toolList"></div>
      </nav>

      <section class="viewer" aria-live="polite">
        <div class="viewer-head">
          <div>
            <h2 class="current-title" id="currentTitle"></h2>
            <p class="current-note" id="currentNote"></p>
          </div>
          <a class="open-link" id="openLink" target="_blank" rel="noopener">单独打开 ↗</a>
        </div>
        <iframe id="calculatorFrame" title="计算器内容"></iframe>
      </section>
    </div>
  </main>

  <section class="summary-panel" id="summaryPanel" aria-hidden="true">
    <div class="summary-card">
      <div class="summary-head"><div><h2>9项费用测算汇总</h2><p class="summary-lead">统一示例：以常见房建/市政项目为背景，展示计算基数、测算费用、费用占基数比例、公式和参考依据。正式项目请替换为实际批复或合同数据。</p></div><button class="summary-close" id="summaryClose" type="button">关闭</button></div>
      <div id="summaryContent"></div>
    </div>
  </section>

  <script>
    const tools = [
      { name: '建设单位管理费', file: '建设单位管理费计算器.html', desc: '财政部、上海市级、浦东新区口径' },
      { name: '工程设计费', file: '工程设计费计算器.html', desc: '初步设计 + 施工图设计' },
      { name: '工程勘察费', file: '工程勘察费计算器.html', desc: '比例估算 + 实物工作量法' },
      { name: '工程监理费', file: '工程监理费计算器.html', desc: '国家/上海/浦东 · 监理费' },
      { name: '工程招标代理费', file: '工程招标代理费计算器.html', desc: '国家/上海 · 招标代理' },
      { name: '工程造价咨询费', file: '工程造价咨询费计算器.html', desc: '上海/行业 · 投资估算/预算/审核' },
      { name: '前期工作咨询费', file: '前期工作咨询费计算器.html', desc: '国家前期咨询参考' },
      { name: '房屋检测鉴定费', file: '房屋检测鉴定费计算器.html', desc: '上海房屋检测指导价' },
      { name: '环境影响评价费', file: '环境影响评价费计算器.html', desc: '国家环评咨询参考' }
    ];
    const list = document.getElementById('toolList');
    const frame = document.getElementById('calculatorFrame');
    const title = document.getElementById('currentTitle');
    const note = document.getElementById('currentNote');
    const openLink = document.getElementById('openLink');

    const summaryRows = [
      {name:'建设单位管理费',basis:'[国家] 财建〔2016〕504号',base:'项目计费基数：5000万元',fee:80,ratio:'1.60%',formula:'1000×2%＋4000×1.5%＝80万元',source:'财政部《基本建设项目建设成本管理规定》'},
      {name:'工程设计费',basis:'[国家] 计价格〔2002〕10号',base:'设计计费额：5000万元',fee:163.9,ratio:'3.28%',formula:'国家设计基价163.9×专业1.0×复杂1.0×附加1.0＝163.9万元',source:'《工程勘察设计收费管理规定》；现行价格按合同市场化'},
      {name:'工程勘察费',basis:'[浦东] 沪浦发改投〔2012〕339号',base:'建安费：5000万元',fee:32,ratio:'0.64%',formula:'5000×0.8%×80%＝32万元（比例估算法）',source:'浦东339号文；实物工作量法可另行录入台班、组日、试验组数'},
      {name:'工程监理费',basis:'[浦东] 沪浦发改投〔2012〕339号',base:'监理计费额：5000万元',fee:145,ratio:'2.90%',formula:'5000×2.90%＝145万元',source:'浦东339号文监理费率表'},
      {name:'工程招标代理费',basis:'[上海] 沪建计联〔2005〕834号、沪价费〔2005〕056号',base:'招标估算额：5000万元',fee:14,ratio:'0.28%',formula:'分段差额定率累进：0.31%/0.285%/0.26%分段计算＝14万元',source:'上海造价服务和招标代理服务收费标准'},
      {name:'工程造价咨询费',basis:'[上海] 沪建计联〔2005〕834号、沪价费〔2005〕056号',base:'全过程造价控制基数：5000万元',fee:40.25,ratio:'0.81%',formula:'分段差额定率累进：1.10%/1.00%/0.85%/0.80%/0.75%＝40.25万元',source:'上海造价服务和招标代理服务收费标准；市场合同参考'},
      {name:'前期工作咨询费',basis:'[国家] 计价格〔1999〕1283号',base:'项目总投资：5000万元',fee:7.6,ratio:'0.15%',formula:'1000×0.20%＋4000×0.14%＝7.60万元',source:'《建设项目前期工作咨询收费暂行规定》'},
      {name:'房屋检测鉴定费',basis:'[上海] 沪建交〔2013〕201号',base:'建筑面积：1000㎡',fee:2.2,ratio:'不适用',formula:'1000㎡×22元/㎡＝22000元＝2.20万元',source:'上海政府投资项目检测收费管理规定；按面积计费，比例不直接适用'},
      {name:'环境影响评价费',basis:'[国家] 计价格〔2002〕125号',base:'项目总投资：5000万元',fee:4.89,ratio:'0.10%',formula:'300×0.15%＋1700×0.12%＋3000×0.08%＝4.89万元',source:'《关于规范环境影响咨询收费有关问题的通知》；现行价格按市场合同'}
    ];
    function renderSummary(){
      const rows=summaryRows.map((r,i)=>`<tr><td>${String(i+1).padStart(2,'0')}　${r.name}</td><td>${r.base}</td><td class="fee">${r.fee.toFixed(2)} 万元</td><td class="ratio">${r.ratio}</td><td>${r.formula}</td><td>${r.basis}<br><small>${r.source}</small></td></tr>`).join('');
      document.getElementById('summaryContent').innerHTML=`<table class="summary-table"><thead><tr><th>费用项目</th><th>计算基数</th><th>测算费用</th><th>占基数比例</th><th>计算公式</th><th>参考依据</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    document.getElementById('summaryButton').addEventListener('click',()=>{renderSummary();const panel=document.getElementById('summaryPanel');panel.classList.add('open');panel.setAttribute('aria-hidden','false');});
    document.getElementById('summaryClose').addEventListener('click',()=>{const panel=document.getElementById('summaryPanel');panel.classList.remove('open');panel.setAttribute('aria-hidden','true');});
    document.getElementById('summaryPanel').addEventListener('click',event=>{if(event.target.id==='summaryPanel')document.getElementById('summaryClose').click();});

    function styleCalculator() {
      try {
        const doc = frame.contentDocument;
        if (!doc || doc.getElementById('collection-box-theme')) return;
        const style = doc.createElement('style');
        style.id = 'collection-box-theme';
        style.textContent = `
          body { background: #fff !important; color: #172033 !important; }
          button { transition: filter .18s ease, transform .18s ease; }
          button:hover { filter: brightness(.96); }
          input:focus, select:focus { outline: 2px solid rgba(37,99,235,.18) !important; outline-offset: 1px; }
        `;
        doc.head.appendChild(style);
        const basis = doc.getElementById('basis');
        if (basis) {
          const pageText = `${doc.title} ${frame.src}`;
          const hasPudongRule = /建设单位管理费|勘察设计费|工程勘察设计|工程勘察费|工程监理费/.test(pageText);
          const isCostConsulting = /工程造价咨询费/.test(pageText);
          if (!hasPudongRule) {
            Array.from(basis.options).filter(option => option.value === 'pudong').forEach(option => option.remove());
          }
          const labels = {
            national: '[国家]',
            central: '[国家]',
            shanghai: '[上海]',
            shanghai2016: '[上海]',
            shanghai2025: '[上海]',
            pudong: '[浦东]',
            pudong2012: '[浦东]',
            industry: '[行业]'
          };
          Array.from(basis.options).forEach(option => {
            const prefix = labels[option.value];
            if (prefix && !/^\[[^\]]+\]/.test(option.textContent.trim())) {
              if (isCostConsulting && option.value === 'national') {
                option.textContent = '[国家] 中价协〔2013〕35号《关于规范工程造价咨询服务收费的通知》（行业参考，非政府定价）';
              } else {
                option.textContent = `${prefix} ${option.textContent.replace(/^\s*[｜|]/, '｜')}`;
              }
            }
          });
          if (isCostConsulting) {
            const refreshCostNote = () => {
              if (basis.value === 'industry') {
                const note = doc.getElementById('note');
                const notice = doc.getElementById('notice');
                const source = doc.getElementById('source');
                if (note) note.textContent = '国家层面没有现行统一政府定价表；中价协〔2013〕35号可作为行业收费参考，实际按合同和市场协商。';
                if (notice) notice.textContent = '中价协〔2013〕35号属于行业协会发布的收费参考，不等同于国家发展改革部门制定的强制性政府收费标准。2015年后相关专业服务价格总体实行市场调节价。';
                if (source) source.textContent = '依据：中价协〔2013〕35号《关于规范工程造价咨询服务收费的通知》；发改价格〔2015〕299号。';
              }
            };
            basis.addEventListener('change', refreshCostNote);
            refreshCostNote();
          }
        }
      } catch (error) { /* 直接打开文件时由浏览器安全策略决定是否允许样式增强 */ }
    }

    function showTool(index) {
      const tool = tools[index];
      document.querySelectorAll('.tool-tab').forEach((button, i) => {
        button.classList.toggle('active', i === index);
        button.setAttribute('aria-selected', i === index ? 'true' : 'false');
      });
      title.textContent = tool.name;
      note.textContent = tool.desc;
      openLink.href = encodeURI(tool.file);
      frame.title = tool.name;
      frame.src = encodeURI(tool.file);
      frame.onload = styleCalculator;
      history.replaceState(null, '', '#' + index);
    }

    tools.forEach((tool, index) => {
      const button = document.createElement('button');
      button.className = 'tool-tab';
      button.type = 'button';
      button.setAttribute('role', 'tab');
      button.innerHTML = `<span class="number">${String(index + 1).padStart(2, '0')}</span><span><span class="tool-name">${tool.name}</span><span class="tool-desc">${tool.desc}</span></span>`;
      button.addEventListener('click', () => showTool(index));
      list.appendChild(button);
    });
    const initialIndex = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 0, 0), tools.length - 1);
    showTool(initialIndex);
  </script>
</body>
</html>
