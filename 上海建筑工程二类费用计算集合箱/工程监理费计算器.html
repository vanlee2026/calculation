<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程监理费计算器</title><style>
:root{--ink:#172033;--muted:#667085;--line:#dfe6f0;--page:#f4f7fb;--soft:#eff5ff;--blue:#2563eb;--dark:#1d4ed8;--warn:#a16207;--warnbg:#fffbeb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--page);color:var(--ink);line-height:1.55}.box{max-width:1080px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 30px #17203312}h1{margin:0;font-size:25px}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.sub,.hint,.source{color:var(--muted);font-size:12px}.basis,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.basis{margin:18px 0;padding:16px;background:var(--soft);border:1px solid #c9dafc;border-radius:14px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,button{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;min-height:40px;background:#fff}button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:750;cursor:pointer;margin-top:16px}.card{padding:14px;border:1px solid var(--line);border-radius:12px}.result{margin-top:18px;padding:18px;background:var(--soft);border:1px solid #c9dafc;border-left:4px solid var(--blue);border-radius:14px}.total{font-size:31px;color:var(--dark);font-weight:850}.notice{margin-top:16px;padding:12px 14px;background:var(--warnbg);border:1px solid #f3d38a;border-radius:10px;color:var(--warn);font-size:12px}.table{margin-top:18px;overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{border:1px solid var(--line);padding:8px;text-align:center}.table th{background:var(--soft)}@media(max-width:700px){body{padding:14px}.box{padding:17px}.basis,.grid{grid-template-columns:1fr}}
</style><style id="palette-refresh">:root{--paper:#f4f1e9;--paper-panel:#fffdf8;--teal:#0f766e;--teal-dark:#0b5f59;--teal-soft:#e6f3ef;--amber:#9a5b13;--amber-soft:#fff3df;--ink-refresh:#20302f;--muted-refresh:#687773;--line-refresh:#d8e0dc;--focus-refresh:#b7cfc7}body{background:var(--paper)!important;color:var(--ink-refresh)!important}.container,.box,.card{background:var(--paper-panel)!important;border-color:var(--line-refresh)!important}.basis,.basis-bar{background:var(--teal-soft)!important;border-color:#a9d4c9!important}.basis select,.basis-bar select{border:2px solid var(--teal)!important;background:#fffdf8!important;box-shadow:0 0 0 3px rgba(15,118,110,.10)!important}.field input,.field select,.card input,.card select{border:2px solid var(--focus-refresh)!important;background:#fffdf8!important}.field:has(input[type=number]),.card:has(input[type=number]){box-shadow:inset 4px 0 0 var(--teal);background:#fcfaf3!important}.result,.result-box{background:var(--teal)!important;border-color:var(--teal-dark)!important;color:#fff!important}.result .total,.result .amount,.result .total-fee{color:#fff!important}.result .sub,.result .result-label,.result .breakdown,.result .breakdown strong{color:#e7f6f1!important}.notice{background:var(--amber-soft)!important;border-color:#e5b76b!important;color:var(--amber)!important}.source{color:var(--muted-refresh)!important}.source a{color:var(--teal-dark)!important;font-weight:800}.table th{background:var(--teal-soft)!important;color:var(--teal-dark)!important}button{background:var(--teal)!important;border-color:var(--teal)!important}button:hover{background:var(--teal-dark)!important}h1,h2,h3{color:var(--ink-refresh)!important}</style></head><body><main class="box"><div class="kicker">SHANGHAI · SUPERVISION FEE</div><h1>工程监理费计算器</h1><p class="sub">按国家历史基准、上海管理口径或浦东新区 339 号文分别测算；监理费与财务监理费不是同一费用。</p><section class="basis"><div><label>计算依据</label><select id="basis"><option value="national">[国家] 发改价格〔2007〕670号《建设工程监理与相关服务收费管理规定》</option><option value="shanghai">[上海] 《上海市建设工程监理管理办法》</option><option value="pudong">[浦东] 沪浦发改投〔2012〕339号《设计勘察费、监理费标准》</option></select></div><div id="note" class="sub"></div><div class="source basis-source" id="source" style="grid-column:1/-1;margin-top:0;padding-top:10px"></div></section><section class="grid"><div class="card"><label>监理计费额（万元）</label><input id="amount" type="number" value="1000" min="0"><p class="hint">国家、上海一般以工程概算中的建安工程费等作为计费基础；实际以项目批复和合同为准。</p></div><div class="card"><label>服务范围调整系数（%）</label><input id="adjust" type="number" value="100" min="0"><p class="hint">用于施工阶段、保修阶段、专业内容等合同范围调整。</p></div><div class="card" id="nationalBox"><label>工程专业</label><select id="professional"><option value="1">建筑/市政公用工程（1.0）</option><option value="0.8">园林绿化工程（0.8）</option><option value="1.1">水运/地铁/桥梁/隧道（1.1）</option><option value="0.9">机场场道/助航灯光（0.9）</option></select></div><div class="card" id="complexBox"><label>复杂程度</label><select id="complexity"><option value="0.85">I级（0.85）</option><option value="1" selected>II级（1.0）</option><option value="1.15">III级（1.15）</option></select></div></section><button id="calc">计算监理费</button><section class="result"><div class="sub">测算结果</div><div class="total" id="total">0.00 万元</div><div id="detail" class="sub"></div></section><div id="notice" class="notice"></div><div class="table"><table><thead><tr><th>计费额节点（万元）</th><th>国家基价（万元）</th><th>浦东339费率（%）</th></tr></thead><tbody id="table"></tbody></table></div></main><script>
const $=id=>document.getElementById(id),N=[0,500,1000,3000,5000,8000,10000,20000,40000,60000,80000,100000,200000,400000,600000,800000,1000000],B=[0,16.5,30.1,78.1,120.8,181,218.6,393.4,708.2,991.4,1255.8,1507,2712.5,4882.6,6835.6,8658.4,10390.1],P=[3.61,3.61,2.90,2.62,2.04,1.80,1.63,1.46,1.37,1.30,1.25];
function interp(x,xs,ys){if(x<=xs[0])return ys[0];for(let i=1;i<xs.length;i++)if(x<=xs[i])return ys[i-1]+(x-xs[i-1])*(ys[i]-ys[i-1])/(xs[i]-xs[i-1]);return ys[ys.length-1]}
function calc(){let m=$('basis').value,a=Math.max(0,Number($('amount').value)||0),adj=(Number($('adjust').value)||0)/100,fee=0,detail='';if(m==='pudong'){fee=a*interp(a,[0,1000,5000,10000,50000,100000,200000,400000,600000,800000,1000000],P)/100*adj;detail=`浦东339：${a.toFixed(2)} × ${ (fee/(a||1)/adj*100).toFixed(3)}% × 调整 ${adj*100}%`;$('note').textContent='浦东有专门 339 号文，监理费表是在国家基准基础上上浮20%后的地方项目口径。';$('notice').textContent='桥梁、长大隧道、服务范围和阶段内容可按文件及合同调整；1000000万元以上不擅自外推。'}else{let base=interp(a,N,B),co=Number($('professional').value)*Number($('complexity').value);fee=base*co*adj;detail=`国家基价 ${base.toFixed(4)} × 专业/复杂系数 ${co.toFixed(3)} × 调整 ${adj*100}%`;$('note').textContent=m==='shanghai'?'上海依法必须监理项目按国家规定上限执行，其他项目实行市场调节价。':'670号文为历史参考基准，2015年起建设项目专业服务价格总体实行市场调节价。';$('notice').textContent=m==='shanghai'?'上海没有另设一套普遍适用的统一费率表，本页采用国家基准作为政府项目参考上限。':'670号文已由发改价格〔2015〕299号进一步放开，合同价不能仅凭旧表直接认定。'}$('total').textContent=fee.toFixed(4)+' 万元';$('detail').textContent=detail;$('source').innerHTML='依据：国家发展改革委发改价格〔2007〕670号、发改价格〔2015〕299号；[上海] 《上海市建设工程监理管理办法》；浦东新区沪浦发改投〔2012〕339号。';}
function render(){ $('table').innerHTML=N.slice(1).map((x,i)=>`<tr><td>${x.toLocaleString()}</td><td>${B[i+1].toFixed(1)}</td><td>${P[Math.min(i,P.length-1)].toFixed(2)}</td></tr>`).join('') }['basis','amount','adjust','professional','complexity'].forEach(id=>$(id).addEventListener('input',calc));$('basis').addEventListener('change',calc);$('calc').onclick=calc;render();calc();
</script></body></html>
