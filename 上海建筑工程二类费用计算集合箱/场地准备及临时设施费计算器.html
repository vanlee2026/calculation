<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场地准备及临时设施费计算器</title><style>
:root{--paper:#f4f1e9;--panel:#fffdf8;--ink:#20302f;--muted:#687773;--line:#d8e0dc;--teal:#0f766e;--soft:#e6f3ef;--amber:#9a5b13}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.container{max-width:1000px;margin:0 auto;padding:34px 22px 50px}h1{margin:0;font-size:clamp(28px,5vw,44px)}.eyebrow{color:var(--teal);font-weight:800;letter-spacing:2px}.subtitle{color:var(--muted);font-size:16px;line-height:1.7}.basis,.card,.result,.notice,.source{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px;margin-top:18px}.basis{background:var(--soft);border-color:#a9d4c9}.basis label,.field label{display:block;font-weight:800;margin-bottom:9px}.basis select,.field input{width:100%;padding:13px;border:2px solid #b7cfc7;border-radius:10px;background:#fffdf8;font:inherit;font-size:17px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{padding:18px;border-left:4px solid var(--teal);background:#fcfaf3;border-radius:12px}.hint,.notice,.source{color:var(--muted);line-height:1.7}.result{background:var(--teal);color:#fff;border-color:var(--teal-dark)}.result h2{margin:0;color:#dff5ef;font-size:16px}.amount{margin-top:7px;font-size:38px;font-weight:900}.amount small{font-size:17px}.notice{background:#fff7e6;border-color:#e5b76b;color:var(--amber)}.source a{color:var(--teal);font-weight:800}@media(max-width:650px){.fields{grid-template-columns:1fr}}
</style></head><body><main class="container"><p class="eyebrow">SHANGHAI · SITE PREPARATION</p><h1>场地准备及临时设施费</h1><p class="subtitle">对建设单位承担的场地准备和临时设施费用进行前期参考测算。</p><section class="basis"><label for="basis">计算依据</label><select id="basis"><option>[国家] 建设项目投资估算及概算费用组成口径（参考）</option><option>[上海] 上海建设项目概算编制实务参考（市场化）</option></select><p class="hint">该费用受场地条件、临时设施方案、工期和建设单位承担范围影响，页面采用比例参考法。</p></section><section class="card"><div class="fields"><div class="field"><label for="construction">建安费（万元）</label><input id="construction" type="number" min="0" step="0.01" placeholder="例如：4000"></div><div class="field"><label for="rate">参考费率（%）</label><input id="rate" type="number" min="0" step="0.01" value="1.00"></div></div></section><section class="result"><h2>场地准备及临时设施费参考结果</h2><div class="amount"><span id="fee">0.00</span> <small>万元</small></div><div id="detail">请输入建安费。</div></section><p class="notice">本结果仅用于前期估算。具体费用应根据建设单位承担内容、施工组织设计和现场临设方案据实确定，不宜直接作为最终结算依据。</p><p class="source">依据：建设项目投资估算、设计概算费用组成及上海项目概算编制实务中的费用归集口径；费率按项目实际方案或合同确定。</p></main><script>const construction=document.getElementById('construction'),rate=document.getElementById('rate'),fee=document.getElementById('fee'),detail=document.getElementById('detail');function calc(){const c=Number(construction.value)||0,r=Number(rate.value)||0,v=c*r/100;fee.textContent=v.toFixed(2);detail.textContent=c?`${c.toFixed(2)}万元 × ${r.toFixed(2)}% = ${v.toFixed(2)}万元（参考）`:'请输入建安费。'}construction.addEventListener('input',calc);rate.addEventListener('input',calc);calc();</script></body></html>
