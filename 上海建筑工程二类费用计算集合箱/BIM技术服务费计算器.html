<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIM技术服务费计算器</title><style>
:root{--paper:#f4f1e9;--panel:#fffdf8;--ink:#20302f;--muted:#687773;--line:#d8e0dc;--teal:#0f766e;--soft:#e6f3ef;--amber:#9a5b13}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.container{max-width:1000px;margin:0 auto;padding:34px 22px 50px}h1{margin:0;font-size:clamp(28px,5vw,44px)}.eyebrow{color:var(--teal);font-weight:800;letter-spacing:2px}.subtitle{color:var(--muted);font-size:16px;line-height:1.7}.basis,.card,.result,.notice,.source{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px;margin-top:18px}.basis{background:var(--soft);border-color:#a9d4c9}.basis label,.field label{display:block;font-weight:800;margin-bottom:9px}.basis select,.field input,.field select{width:100%;padding:13px;border:2px solid #b7cfc7;border-radius:10px;background:#fffdf8;font:inherit;font-size:17px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{padding:18px;border-left:4px solid var(--teal);background:#fcfaf3;border-radius:12px}.hint,.notice,.source{color:var(--muted);line-height:1.7}.result{background:var(--teal);color:#fff;border-color:var(--teal-dark)}.result h2{margin:0;color:#dff5ef;font-size:16px}.amount{margin-top:7px;font-size:38px;font-weight:900}.amount small{font-size:17px}.notice{background:#fff7e6;border-color:#e5b76b;color:var(--amber)}.source a{color:var(--teal);font-weight:800}@media(max-width:650px){.fields{grid-template-columns:1fr}}
</style></head><body><main class="container"><p class="eyebrow">SHANGHAI · BIM SERVICE</p><h1>BIM技术服务费计算器</h1><p class="subtitle">按建筑面积和 BIM 应用深度，对上海地区 BIM 技术服务费进行前期参考测算。</p><section class="basis"><label for="basis">计算依据</label><select id="basis"><option>[上海] 《上海市建筑信息模型(BIM)技术服务收费标准》（团体标准）</option></select><p class="hint">团体标准属于行业参考，实际费用还需结合项目规模、应用阶段、模型深度和服务合同确定。</p></section><section class="card"><div class="fields"><div class="field"><label for="area">建筑面积（㎡）</label><input id="area" type="number" min="0" step="0.01" placeholder="例如：10000"></div><div class="field"><label for="level">BIM应用深度</label><select id="level"><option value="8">基础应用｜8元/㎡</option><option value="15" selected>标准应用｜15元/㎡</option><option value="25">深度应用｜25元/㎡</option></select></div></div></section><section class="result"><h2>BIM技术服务费参考结果</h2><div class="amount"><span id="fee">0.00</span> <small>万元</small></div><div id="detail">请输入建筑面积。</div></section><p class="notice">本结果为上海地区 BIM 技术服务费的前期参考值，不等同于政府定价，也不替代 BIM 实施方案和服务合同报价。</p><p class="source">依据：上海市绿色建筑协会发布的《上海市建筑信息模型(BIM)技术服务收费标准》（团体标准）。</p></main><script>const area=document.getElementById('area'),level=document.getElementById('level'),fee=document.getElementById('fee'),detail=document.getElementById('detail');function calc(){const a=Number(area.value)||0,r=Number(level.value)||0,v=a*r/10000;fee.textContent=v.toFixed(2);detail.textContent=a?`${a.toFixed(2)}㎡ × ${r}元/㎡ = ${v.toFixed(2)}万元（参考）`:'请输入建筑面积。'}area.addEventListener('input',calc);level.addEventListener('change',calc);calc();</script></body></html>
