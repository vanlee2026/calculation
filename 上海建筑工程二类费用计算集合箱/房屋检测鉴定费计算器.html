<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房屋检测鉴定费计算器</title><style>
:root{--ink:#172033;--muted:#667085;--line:#dfe6f0;--page:#f4f7fb;--soft:#eff5ff;--blue:#2563eb;--dark:#1d4ed8;--warn:#a16207;--warnbg:#fffbeb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--page);color:var(--ink);line-height:1.55}.box{max-width:900px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 30px #17203312}h1{margin:0;font-size:25px}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.sub,.hint,.source{color:var(--muted);font-size:12px}.basis,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.basis{margin:18px 0;padding:16px;background:var(--soft);border:1px solid #c9dafc;border-radius:14px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,button{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;min-height:40px;background:#fff}button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:750;cursor:pointer;margin-top:16px}.card{padding:14px;border:1px solid var(--line);border-radius:12px}.result{margin-top:18px;padding:18px;background:var(--soft);border:1px solid #c9dafc;border-left:4px solid var(--blue);border-radius:14px}.total{font-size:31px;color:var(--dark);font-weight:850}.notice{margin-top:16px;padding:12px 14px;background:var(--warnbg);border:1px solid #f3d38a;border-radius:10px;color:var(--warn);font-size:12px}.table{margin-top:18px;overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{border:1px solid var(--line);padding:8px;text-align:center}.table th{background:var(--soft)}@media(max-width:700px){body{padding:14px}.box{padding:17px}.basis,.grid{grid-template-columns:1fr}}
</style><style id="palette-refresh">:root{--paper:#f4f1e9;--paper-panel:#fffdf8;--teal:#0f766e;--teal-dark:#0b5f59;--teal-soft:#e6f3ef;--amber:#9a5b13;--amber-soft:#fff3df;--ink-refresh:#20302f;--muted-refresh:#687773;--line-refresh:#d8e0dc;--focus-refresh:#b7cfc7}body{background:var(--paper)!important;color:var(--ink-refresh)!important}.container,.box,.card{background:var(--paper-panel)!important;border-color:var(--line-refresh)!important}.basis,.basis-bar{background:var(--teal-soft)!important;border-color:#a9d4c9!important}.basis select,.basis-bar select{border:2px solid var(--teal)!important;background:#fffdf8!important;box-shadow:0 0 0 3px rgba(15,118,110,.10)!important}.field input,.field select,.card input,.card select{border:2px solid var(--focus-refresh)!important;background:#fffdf8!important}.field:has(input[type=number]),.card:has(input[type=number]){box-shadow:inset 4px 0 0 var(--teal);background:#fcfaf3!important}.result,.result-box{background:var(--teal)!important;border-color:var(--teal-dark)!important;color:#fff!important}.result .total,.result .amount,.result .total-fee{color:#fff!important}.result .sub,.result .result-label,.result .breakdown,.result .breakdown strong{color:#e7f6f1!important}.notice{background:var(--amber-soft)!important;border-color:#e5b76b!important;color:var(--amber)!important}.source{color:var(--muted-refresh)!important}.source a{color:var(--teal-dark)!important;font-weight:800}.table th{background:var(--teal-soft)!important;color:var(--teal-dark)!important}button{background:var(--teal)!important;border-color:var(--teal)!important}button:hover{background:var(--teal-dark)!important}h1,h2,h3{color:var(--ink-refresh)!important}</style></head><body><main class="box"><div class="kicker">SHANGHAI · HOUSE INSPECTION & APPRAISAL</div><h1>房屋检测鉴定费计算器</h1><p class="sub">按房屋检测鉴定类型、建筑面积及测绘/评审服务分别测算；检测费与房屋安全鉴定结论责任应由具备条件的机构承担。</p><section class="basis"><div><label>计算依据</label><select id="basis"><option value="shanghai">[上海] 沪建交〔2013〕201号《政府投资项目检测收费管理规定》</option></select></div><div id="note" class="sub"></div><div class="source basis-source" id="source" style="grid-column:1/-1;margin-top:0;padding-top:10px"></div></section><section class="grid"><div class="card"><label>建筑面积（㎡）</label><input id="area" type="number" value="1000" min="0"></div><div class="card"><label>检测鉴定类型</label><select id="type"><option value="17">房屋完损状况检测（17元/㎡）</option><option value="22">房屋安全检测（22元/㎡）</option><option value="18">房屋损坏趋势检测（初测，18元/㎡）</option><option value="17">房屋损坏趋势检测（复测，17元/㎡）</option><option value="24">结构及使用功能改变检测（24元/㎡）</option><option value="25">抗震能力检测（25元/㎡）</option><option value="28">优秀历史建筑综合检测（28元/㎡）</option></select></div><div class="card"><label>测绘服务</label><select id="survey"><option value="0">不计测绘</option><option value="7.5">普通建筑测绘（暂按7.5元/㎡）</option><option value="12.5">优秀历史建筑测绘（暂按12.5元/㎡）</option></select></div><div class="card"><label>技术审查/评审费（元）</label><input id="review" type="number" value="0" min="0"><p class="hint">如涉及危险房屋、保护建筑或专项评审，请按委托合同或机构公示标准录入。</p></div></section><button id="calc">计算检测鉴定费</button><section class="result"><div class="sub">测算结果</div><div class="total" id="total">0.00 元</div><div id="detail" class="sub"></div></section><div id="notice" class="notice"></div></main><script>
const $=id=>document.getElementById(id);function calc(){let m=$('basis').value,a=Math.max(0,Number($('area').value)||0),r=Number($('type').value),s=Number($('survey').value),review=Math.max(0,Number($('review').value)||0),detect=Math.max(10000,a*r),map=a*s,total=detect+map+review;$('total').textContent=total.toLocaleString('zh-CN',{minimumFractionDigits:2})+' 元';$('detail').textContent=`检测鉴定费：${a.toFixed(2)}㎡ × ${r}元/㎡，按最低10000元计；测绘费 ${map.toFixed(2)} 元；评审费 ${review.toFixed(2)} 元。`;$('note').textContent=m==='shanghai'?'上海201号文针对政府投资房屋建筑、市政基础设施和公路工程建设项目检测收费管理，文件有效期已延长至2027年12月31日。':m==='pudong'?'未查到浦东新区另行制定房屋检测鉴定费率，暂按上海公示/合同口径。':'国家没有统一适用于所有房屋检测鉴定项目的政府定价表，检测项目、实物工作量和风险责任应由合同确定。';$('notice').textContent='本页沿用原工具中的上海指导价示例，适合前期估算；正式收费应核对上海住建部门文件、机构公示标准和具体检测项目，不能仅按面积机械套用。';$('source').innerHTML='依据：沪建交〔2013〕201号及沪建法规〔2022〕657号；《上海市房屋检测鉴定单位管理办法（暂行）》沪房规范〔2026〕1号。'}['basis','area','type','survey','review'].forEach(id=>$(id).addEventListener('input',calc));$('calc').onclick=calc;calc();
</script></body></html>
