<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程造价咨询费计算器</title><style>
:root{--ink:#172033;--muted:#667085;--line:#dfe6f0;--page:#f4f7fb;--soft:#eff5ff;--blue:#2563eb;--dark:#1d4ed8;--warn:#a16207;--warnbg:#fffbeb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--page);color:var(--ink);line-height:1.55}.box{max-width:900px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 30px #17203312}h1{margin:0;font-size:25px}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.sub,.hint,.source{color:var(--muted);font-size:12px}.basis,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.basis{margin:18px 0;padding:16px;background:var(--soft);border:1px solid #c9dafc;border-radius:14px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,button{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px;min-height:40px;background:#fff}button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:750;cursor:pointer;margin-top:16px}.card{padding:14px;border:1px solid var(--line);border-radius:12px}.result{margin-top:18px;padding:18px;background:var(--soft);border:1px solid #c9dafc;border-left:4px solid var(--blue);border-radius:14px}.total{font-size:31px;color:var(--dark);font-weight:850}.notice{margin-top:16px;padding:12px 14px;background:var(--warnbg);border:1px solid #f3d38a;border-radius:10px;color:var(--warn);font-size:12px}.table{margin-top:18px;overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{border:1px solid var(--line);padding:8px;text-align:center}.table th{background:var(--soft)}@media(max-width:700px){body{padding:14px}.box{padding:17px}.basis,.grid{grid-template-columns:1fr}}
</style><style id="palette-refresh">:root{--paper:#f4f1e9;--paper-panel:#fffdf8;--teal:#0f766e;--teal-dark:#0b5f59;--teal-soft:#e6f3ef;--amber:#9a5b13;--amber-soft:#fff3df;--ink-refresh:#20302f;--muted-refresh:#687773;--line-refresh:#d8e0dc;--focus-refresh:#b7cfc7}body{background:var(--paper)!important;color:var(--ink-refresh)!important}.container,.box,.card{background:var(--paper-panel)!important;border-color:var(--line-refresh)!important}.basis,.basis-bar{background:var(--teal-soft)!important;border-color:#a9d4c9!important}.basis select,.basis-bar select{border:2px solid var(--teal)!important;background:#fffdf8!important;box-shadow:0 0 0 3px rgba(15,118,110,.10)!important}.field input,.field select,.card input,.card select{border:2px solid var(--focus-refresh)!important;background:#fffdf8!important}.field:has(input[type=number]),.card:has(input[type=number]){box-shadow:inset 4px 0 0 var(--teal);background:#fcfaf3!important}.result,.result-box{background:var(--teal)!important;border-color:var(--teal-dark)!important;color:#fff!important}.result .total,.result .amount,.result .total-fee{color:#fff!important}.result .sub,.result .result-label,.result .breakdown,.result .breakdown strong{color:#e7f6f1!important}.notice{background:var(--amber-soft)!important;border-color:#e5b76b!important;color:var(--amber)!important}.source{color:var(--muted-refresh)!important}.source a{color:var(--teal-dark)!important;font-weight:800}.table th{background:var(--teal-soft)!important;color:var(--teal-dark)!important}button{background:var(--teal)!important;border-color:var(--teal)!important}button:hover{background:var(--teal-dark)!important}h1,h2,h3{color:var(--ink-refresh)!important}</style></head><body><main class="box"><div class="kicker">SHANGHAI · COST CONSULTING FEE</div><h1>工程造价咨询费计算器</h1><p class="sub">覆盖投资估算、设计概算、施工图预算/清单、全过程造价控制和工程造价审核等常用服务。</p><section class="basis"><div><label>计算依据</label><select id="basis"><option value="shanghai">[上海] 沪建计联〔2005〕834号、沪价费〔2005〕056号《造价服务和招标代理服务收费标准》</option><option value="industry">[行业] 中价协〔2013〕35号《关于规范工程造价咨询服务收费的通知》（行业参考，非政府定价）</option></select></div><div id="note" class="sub"></div><div class="source basis-source" id="source" style="grid-column:1/-1;margin-top:0;padding-top:10px"></div></section><section class="grid"><div class="card"><label>咨询服务类型</label><select id="type"><option value="invest">编制投资估算</option><option value="design">编制设计概算</option><option value="budget">施工图预算/工程量清单/标底</option><option value="whole">施工阶段全过程造价控制</option><option value="audit">工程造价审核（送审价）</option><option value="diff">核增核减额审核</option></select></div><div class="card"><label>计费基数（万元）</label><input id="amount" type="number" value="1000" min="0"><p class="hint">按服务类型录入总投资、工程造价、送审价或核增减额。</p></div><div class="card"><label>合同调整系数（%）</label><input id="adjust" type="number" value="100" min="0"></div></section><button id="calc">计算造价咨询费</button><section class="result"><div class="sub">测算结果</div><div class="total" id="total">0.00 元</div><div id="detail" class="sub"></div></section><div id="notice" class="notice"></div><div class="table"><table><thead><tr><th>额级（万元）</th><th>当前费率（%）</th></tr></thead><tbody id="table"></tbody></table></div></main><script>
const $=id=>document.getElementById(id),X=[0,100,500,1000,3000,5000,10000,Infinity],R={invest:[.08,.07,.06,.05,.045,.03,.015],design:[.17,.15,.13,.11,.085,.07,.04],budget:[.37,.35,.33,.29,.27,.22,.18],whole:[1.1,1,.85,.8,.75,.7,.65],audit:[.36,.28,.22,.18,.15,.12,.09],diff:[6.3,5.7,5.1,4,3.8,3.6,3.2]};function calc(){let m=$('basis').value,a=Math.max(0,Number($('amount').value)||0),adj=(Number($('adjust').value)||0)/100,r=R[$('type').value],fee=0,parts=[];for(let i=0;i<r.length;i++){let u=X[i+1],p=Math.max(0,Math.min(a,u)-X[i]);if(p>0){fee+=p*r[i]/100;parts.push(`${X[i]}—${u===Infinity?'以上':u}：${p.toFixed(2)}×${r[i]}%`)}if(a<=u)break}fee*=10000*adj;$('total').textContent=fee.toLocaleString('zh-CN',{minimumFractionDigits:2})+' 元';$('detail').textContent=parts.join('；')+`；合同调整 ${adj*100}%`;$('note').textContent=m==='shanghai'?'上海2005标准按差额定率累进法；本页沿用现有附件二费率。':m==='pudong'?'目前未查到浦东新区另行制定造价咨询费率，原则上沿用上海标准或项目合同。':'国家没有一套现行统一的工程造价咨询政府定价表，采用上海标准仅作对比参考。';$('notice').textContent='2015年后专业服务价格总体市场化，2005上海表适合作为政府投资项目历史参考、预算控制或合同谈判基准，不能替代合同约定。';$('source').innerHTML='依据：沪建计联〔2005〕834号、沪价费〔2005〕056号；发改价格〔2015〕299号。'}function render(){let r=R[$('type').value];$('table').innerHTML=X.slice(0,-1).map((x,i)=>`<tr><td>${x}—${X[i+1]===Infinity?'以上':X[i+1]}</td><td>${r[i]}%</td></tr>`).join('')}['basis','type','amount','adjust'].forEach(id=>$(id).addEventListener('input',()=>{render();calc()}));$('calc').onclick=calc;render();calc();
</script></body></html>
