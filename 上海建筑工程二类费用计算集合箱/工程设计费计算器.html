<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程设计费计算器</title><style>
:root{--paper:#f4f1e9;--panel:#fffdf8;--teal:#0f766e;--teal-dark:#0b5f59;--teal-soft:#e6f3ef;--amber:#9a5b13;--amber-soft:#fff3df;--ink:#20302f;--muted:#687773;--line:#d8e0dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:clip}body{padding:28px;background:var(--paper);color:var(--ink);line-height:1.55}.box{max-width:1080px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 30px #20302f12}.kicker{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:0;font-size:25px}.sub,.hint{color:var(--muted);font-size:12px}.basis,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.basis{margin:18px 0;padding:16px;background:var(--teal-soft);border:1px solid #a9d4c9;border-radius:14px}.basis-note{font-size:13px;color:#285f58;padding-top:22px}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input,select,button{width:100%;font:inherit;border:2px solid #b7cfc7;border-radius:9px;padding:9px 10px;min-height:40px;background:var(--panel);color:var(--ink)}button{margin-top:16px;background:var(--teal);border-color:var(--teal);color:#fff;font-weight:800;cursor:pointer}.card{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.card:has(input[type=number]){box-shadow:inset 4px 0 0 var(--teal)}.section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.section h2{font-size:16px;margin:0 0 12px}.result{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-top:18px;padding:18px;border-radius:14px;background:var(--teal);border:1px solid var(--teal-dark);color:#fff}.amount{font-size:32px;font-weight:850;color:#fff}.breakdown{border-left:1px solid #ffffff55;padding-left:16px;color:#e7f6f1;font-size:13px}.notice{margin-top:16px;padding:12px 14px;background:var(--amber-soft);border:1px solid #e5b76b;border-radius:10px;color:var(--amber);font-size:12px}.source{grid-column:1/-1;margin-top:0;padding-top:10px;color:var(--muted);font-size:12px;border-top:1px solid #c9ded7}.source a{color:var(--teal-dark);font-weight:800;text-decoration:none}.table-wrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:var(--teal-soft);color:var(--teal-dark)}@media(max-width:700px){body{padding:14px}.box{padding:17px}.basis,.grid,.result{grid-template-columns:1fr}.basis-note{padding-top:0}.breakdown{border:0;border-top:1px solid #ffffff55;padding:12px 0 0}}
</style></head><body><main class="box"><div class="kicker">SHANGHAI · DESIGN FEE</div><h1>工程设计费计算器</h1><p class="sub">只计算工程设计费，包含初步设计及施工图设计；工程勘察费已单独设置页面。</p><section class="basis"><div><label>计算依据</label><select id="basis"><option value="national">[国家] 计价格〔2002〕10号《工程勘察设计收费管理规定》</option><option value="shanghai">[上海] 政府投资房屋建筑项目审批改革试点通知</option><option value="pudong">[浦东] 沪浦发改投〔2012〕339号《设计勘察费、监理费标准》</option></select></div><div class="basis-note" id="basisNote"></div><div class="source" id="source"></div></section><section class="grid"><div class="card"><label for="designBase">设计计费额（万元）</label><input id="designBase" type="number" min="0" value="1000"><p class="hint" id="designHint">国家口径通常为建安费＋设备购置费＋联合试运转费等，不包括土地费及其他建设费用。</p></div><div class="card"><label for="adjustment">合同／市场调整系数（%）</label><input id="adjustment" type="number" min="0" value="100"><p class="hint">2015年后设计服务价格总体实行市场调节价，用于模拟合同折扣或上浮。</p></div></section><section id="nationalInputs" class="section"><h2>国家参考口径参数</h2><div class="grid"><div class="card"><label>工程专业调整系数</label><select id="profession"><option value="1">建筑、市政、电信（1.0）</option><option value="1.1">人防、园林绿化、厂区工艺（1.1）</option><option value="1.1">水运、地铁、桥梁、隧道（1.1）</option><option value="0.9">公路、城市道路（0.9）</option><option value="0.8">机场场道（0.8）</option></select></div><div class="card"><label>工程复杂程度系数</label><select id="complexity"><option value="0.85">I级（0.85）</option><option value="1" selected>II级（1.0）</option><option value="1.15">III级（1.15）</option></select></div><div class="card"><label>附加调整系数</label><input id="additional" type="number" value="1" min="0" step="0.1"></div></div></section><section id="pudongInputs" class="section" style="display:none"><h2>浦东339号文参数</h2><div class="card"><label>设计专业类别</label><select id="pudongCategory"><option value="road">城市道路综合</option><option value="building">建筑、市政、给排水、电信</option><option value="bridge">桥梁（特殊情形）</option><option value="other">人防、园林绿化、水运</option></select></div></section><button id="calc">计算设计费</button><section class="result"><div><div class="sub" style="color:#e7f6f1">设计费</div><div class="amount" id="total">0.0000 万元</div></div><div class="breakdown" id="detail">请输入设计计费额。</div></section><div class="notice" id="notice"></div><section class="section"><h2>当前依据的主要参数</h2><div class="table-wrap"><table id="rateTable"></table></div></section></main><script>
const $=id=>document.getElementById(id),BASE=[[200,9],[500,20.9],[1000,38.8],[3000,103.8],[5000,163.9],[8000,249.6],[10000,304.8],[20000,566.8],[40000,1054],[60000,1515.2],[80000,1960.1],[100000,2393.4],[200000,4450.8],[400000,8276.7],[600000,11897.5],[800000,15391.4],[1000000,18793.8],[2000000,34948.9]],PD={road:[[200,3.6],[1000,3.5],[5000,3.2],[10000,2.9],[50000,2.2]],building:[[200,4.5],[1000,3.5],[5000,3],[10000,2.7],[50000,2.3]],other:[[200,4.5],[1000,3.5],[5000,3],[10000,2.7],[50000,2.3]]};
function interp(x,t){if(x<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++)if(x<=t[i][0])return t[i-1][1]+(x-t[i-1][0])*(t[i][1]-t[i-1][1])/(t[i][0]-t[i-1][0]);return null}function nationalBase(x){if(x<=0)return 0;if(x<=200)return 9;return interp(x,BASE)||x*.016}function calc(){const m=$('basis').value,x=Number($('designBase').value)||0,a=(Number($('adjustment').value)||0)/100;let fee=0,detail='',notice='',source='';$('nationalInputs').style.display=m==='national'?'block':'none';$('pudongInputs').style.display=m==='pudong'?'block':'none';if(m==='national'){const b=nationalBase(x),p=Number($('profession').value),c=Number($('complexity').value),ad=Number($('additional').value)||0;fee=b*p*c*ad*a;detail=`国家设计基价 ${b.toFixed(4)} × 专业 ${p} × 复杂 ${c} × 附加 ${ad} × 调整 ${a*100}% = ${fee.toFixed(4)} 万元。`;$('basisNote').textContent='国家10号文设计费历史基准参考；现行合同价格总体按市场协商。';$('designHint').textContent='建安费＋设备购置费＋联合试运转费等，不包括土地费及其他建设费用。';source='依据：国家计委、建设部计价格〔2002〕10号；发改价格〔2015〕299号。';$('source').innerHTML=source+' <a href="https://www.ndrc.gov.cn/xxgk/zcfb/tz/202009/t20200927_1239632_ext.html" target="_blank" rel="noopener">查看公开文件 ↗</a>';}else if(m==='shanghai'){const b=nationalBase(x);fee=b*a;detail=`上海试点：设计费参考国家设计基价 ${b.toFixed(4)} × 市场调整 ${a*100}% = ${fee.toFixed(4)} 万元。`;$('basisNote').textContent='上海政府投资房屋建筑试点参考国家设计基价；不是所有市场项目的统一强制费率。';$('designHint').textContent='通常填建安费及纳入设计计费的设备购置费。';source='依据：上海市政府投资房屋建筑项目审批改革试点通知；计价格〔2002〕10号。';$('source').textContent=source;}else{const cat=$('pudongCategory').value,rate=cat==='bridge'?interp(x,PD.building)*1.4:cat==='other'?interp(x,PD.other):interp(x,PD[cat]);if(x>50000){notice='浦东339号文对50000万元以上项目注明另定，本页不擅自外推。';detail='设计费请按浦东文件及项目主管部门口径另行确定。';fee=0}else{fee=x*(rate||0)/100*a;detail=`浦东339：设计计费额 ${x.toFixed(2)} × ${rate?rate.toFixed(3):'—'}% × 调整 ${a*100}% = ${fee.toFixed(4)} 万元。`}$('basisNote').textContent='浦东339号文设计费分类费率；50000万元以上另定。';$('designHint').textContent='浦东项目通常以建安费作为主要设计计费基础。';source='依据：沪浦发改投〔2012〕339号《设计勘察费、监理费标准》。';$('source').textContent=source;}$('total').textContent=fee.toFixed(4)+' 万元';$('detail').textContent=detail;$('notice').textContent=notice||'设计费与工程勘察费分开计算，本页面不含勘察费。';render(m)}function render(m){$('rateTable').innerHTML=m==='pudong'?'<tr><th>类别</th><th>200万</th><th>1000万</th><th>5000万</th><th>10000万</th><th>50000万</th></tr><tr><td>城市道路综合</td><td>3.6%</td><td>3.5%</td><td>3.2%</td><td>2.9%</td><td>2.2%</td></tr><tr><td>建筑、市政、给排水、电信</td><td>4.5%</td><td>3.5%</td><td>3.0%</td><td>2.7%</td><td>2.3%</td></tr>':'<tr><th>设计计费额（万元）</th><th>设计收费基价（万元）</th></tr>'+BASE.map(r=>`<tr><td>${r[0].toLocaleString()}</td><td>${r[1].toFixed(1)}</td></tr>`).join('')}['basis','designBase','adjustment','profession','complexity','additional','pudongCategory'].forEach(id=>$(id).addEventListener('input',calc));$('basis').addEventListener('change',calc);$('calc').onclick=calc;calc();
</script></body></html>
